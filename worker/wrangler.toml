name = "awadhland-leads"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Route the worker at a first-party host so the site posts to its own domain.
# routes = [{ pattern = "lead.awadhland.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://awadhland.com,https://www.awadhland.com,http://localhost:3000"
# https://form.jotform.com/262671761366060 — the hero enquiry form (name, phone, email, city, purpose).
JOTFORM_LEAD_FORM_ID = "262671761366060"
# our field name → the form's real input name, read off the live form's HTML (view-source on the
# JotForm page; each input's `name="q{QID}_..."` attribute). No API key needed to read these off a
# form you can already view. This form has no field for budget/location/message, so the band
# variant's extra fields (see components/LeadForm.tsx) are collected but not forwarded to JotForm.
JOTFORM_LEAD_FIELDS = '{"name":"q9_name","phone":"q10_phone","email":"q4_q4_email2","city":"q5_q5_textbox3","purpose":"q6_q6_radio4"}'
# JOTFORM_DIGEST_FORM_ID = "TODO"
# JOTFORM_DIGEST_FIELDS = '{"email":"TODO","locale":"TODO","page":"TODO"}'

[[analytics_engine_datasets]]
binding = "LEAD_EVENTS"
dataset = "awadhland_lead_events"
